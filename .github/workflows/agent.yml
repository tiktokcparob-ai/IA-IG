name: KODA-7 AI Agent

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:        # تشغيل يدوي
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: true
        default: 'agent'
        type: choice
        options:
          - agent
          - scheduler
          - maintenance

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KODA-7 Agent
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'agent' }}
        run: |
          python agent.py

      - name: Auto commit changes (if any)
        if: success()
        run: |
          git config user.name "KODA-7 Bot"
          git config user.email "bot@koda-7.ai"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update by KODA-7 [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f .env
          find . -name "*.pyc" -delete
