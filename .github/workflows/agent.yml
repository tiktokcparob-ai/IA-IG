name: AI Agent Workflow
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pyTelegramBotAPI groq PyGithub python-dotenv
        
      - name: Create .env from single secret
        run: echo "${{ secrets.ALL_SECRETS }}" > .env
        
      - name: Run AI Agent
        run: python agent.py
